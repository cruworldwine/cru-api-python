name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # the Release workflow runs these same checks before it publishes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

# Every project command runs with --locked: it fails if uv.lock is out of date with pyproject.toml.
jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: ruff check
        run: uv run --locked --only-group lint ruff check --output-format=github .
      - name: ruff format
        run: uv run --locked --only-group lint ruff format --check --diff .

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
      - name: mypy
        run: uv run --locked --no-dev --group typecheck mypy

  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python: "3.15"
          - os: windows-latest
            python: "3.15"
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: pytest
        run: uv run --locked --no-dev --group test pytest --cov --cov-report=term-missing

  test-lowest:
    name: Test (lowest supported dependencies, Python 3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.9"
      - name: pytest, with httpx and the test tools at their lowest allowed versions
        run: uv run --isolated --resolution lowest-direct --no-dev --group test pytest

  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
      - name: Build
        run: uv build
      - name: twine check
        run: uv run --locked --only-group release twine check --strict dist/*
      - name: The wheel is typed
        run: |
          uv run --no-project python - <<'EOF'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()
          sys.exit(0 if 'cruworldwine/py.typed' in names else 'py.typed is missing from the wheel')
          EOF
      - name: The wheel installs and imports on its own
        run: |
          wheel="$(ls dist/*.whl)"
          uv run --isolated --no-project --with "$wheel" python -c 'import cruworldwine; print(cruworldwine.__version__)'
