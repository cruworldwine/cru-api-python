[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cruworldwine"
version = "0.1.0"
description = "Python client for the Cru Trading API"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.24,<1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://developers.cruworldwine.com"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/cruworldwine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = false
warn_unused_ignores = true
